version: 2.1

jobs:
  build:
    docker:
      - image: cimg/go:1.17.12
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: linux AMD
          command: go build -o bogus .
      - store_artifacts:
          path: bogus
          destination: bogus

workflows:
  circleci-logs-build:
    jobs:
      - build
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/go:1.17.12
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: linux AMD
          command: |
                   mkdir /tmp/artifacts;
                   go build -o /tmp/artifacts/bogus .
      - store_artifacts:
          path: /tmp/artifacts

workflows:
  circleci-logs-build:
    jobs:
      - build